version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: pdf_qa_redis_stack
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
